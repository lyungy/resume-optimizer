# Collector 配置文件
# 求职岗位自动采集模块

# ============================================================
# 搜索条件
# ============================================================
search:
  # 默认关键词（支持多个）
  keywords:
    - "技术经理"
    - "Java架构师"
    - "项目经理"
    - "技术总监"

  # 默认城市（支持多个）
  cities:
    - "上海"
    # - "北京"
    # - "深圳"
    # - "杭州"
    # - "成都"

  # 经验要求
  experience: "5-10年"

  # 最低薪资（元/月）
  salary_min: 15000

  # 每次搜索最大数量
  limit: 20

# ============================================================
# 导入配置
# ============================================================
import:
  # 最多导入 JD 数量
  max_count: 50

  # 导入后自动解析 JD
  auto_parse: true

  # 重复检测（基于 title + company）
  skip_duplicates: true

  # 导入间隔（秒，防 API 压力）
  interval: 1

  # 导入模式：direct（直接调用 backend service）| http（通过 REST API）
  import_mode: direct

# ============================================================
# 平台配置
# ============================================================
platforms:
  boss:
    enabled: true
    name: "Boss直聘"
    base_url: "https://www.zhipin.com"
    search_url: "https://www.zhipin.com/web/geek/job"
    # 城市代码映射
    city_codes:
      "北京": "101010100"
      "上海": "101020100"
      "广州": "101280100"
      "深圳": "101280600"
      "杭州": "101210100"
      "成都": "101270100"
      "南京": "101190100"
      "武汉": "101200100"
      "西安": "101110100"
      "苏州": "101190400"
      "厦门": "101230200"
      "长沙": "101250100"
      "重庆": "101040100"
      "天津": "101030100"
    # 经验代码映射
    experience_codes:
      "不限": "108"
      "1-3年": "101"
      "3-5年": "102"
      "5-10年": "103"
      "10年以上": "104"

  lagou:
    enabled: false
    name: "拉勾网"
    base_url: "https://www.lagou.com"

  liepin:
    enabled: false
    name: "猎聘"
    base_url: "https://www.liepin.com"

# ============================================================
# 筛选规则
# ============================================================
filter:
  # 大龄友好度阈值（0-100）
  min_score: 60

  # 正向信号（加分项）
  positive_signals:
    - "看重经验"
    - "资深"
    - "高级"
    - "架构"
    - "管理"
    - "不加班"
    - "弹性"
    - "扁平"
    - "技术驱动"
    - "15薪"
    - "16薪"
    - "17薪"
    - "18薪"

  # 负向信号（减分项）
  negative_signals:
    - "35岁以下"
    - "30岁以下"
    - "年轻团队"
    - "高强度"
    - "996"
    - "应届"
    - "实习"
    - "急聘"

# ============================================================
# 简历优化系统对接
# ============================================================
resume_optimizer:
  api_base: "http://localhost:8000/api/v1"

# ============================================================
# 搜索历史
# ============================================================
history:
  enabled: true
  file: "data/search_history.json"
  max_age_days: 30

# ============================================================
# 浏览器配置
# ============================================================
browser:
  # 模式: patchright（独立反检测浏览器）| cdp（连接已有浏览器，可能被检测）
  mode: patchright
  # CDP 连接地址（cdp 模式专用）
  cdp_url: "http://localhost:18800"
  # 是否无头模式（调试时建议 false）
  headless: false
  # 页面加载超时（秒）
  timeout: 30
  # 操作间隔（秒，调试阶段设1-2，生产环境设3-5）
  min_interval: 1
  max_interval: 2
  # 每页最大滚动次数
  max_scrolls: 5

# ============================================================
# 详情页抓取配置
# ============================================================
detail:
  # 是否默认抓取详情页 JD（建议关闭，列表页信息已够用）
  enabled: false
  # 详情页之间的间隔（秒，随机范围）
  interval_min: 5
  interval_max: 10

# ============================================================
# 人机行为模拟配置
# ============================================================
human:
  # 逐字输入间隔（ms）
  type_delay_min: 80
  type_delay_max: 200
  # 输入额外停顿概率
  type_pause_chance: 0.15
  type_pause_min: 300
  type_pause_max: 800
  # 打错字概率
  typo_chance: 0.05
  # 鼠标移动步数
  mouse_move_steps_min: 10
  mouse_move_steps_max: 20
  # 滚动距离（像素）
  scroll_distance_min: 300
  scroll_distance_max: 600
